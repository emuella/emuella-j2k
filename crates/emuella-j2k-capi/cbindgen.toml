language = "C"
include_guard = "EMUELLA_J2K_H"
autogen_warning = "/* Generated by cbindgen 0.29.4. Do not edit. */"
header = """
/*
 * Experimental Emuella JPEG 2000 C ABI, version zero.
 *
 * Every non-null pointer must remain valid and correctly aligned for its
 * complete synchronous call. Writable outputs must not overlap one another,
 * input storage, Rust-owned handles or callback destinations. An opaque handle
 * must be the exact live value returned by this library and must be destroyed
 * exactly once after all calls using it have quiesced; destroy accepts null.
 *
 * A decoder borrows the source context until decoder destruction. The source
 * bytes, length and context identity must remain unchanged, and read_at must be
 * safe for concurrent invocation, fill the requested range completely, retain
 * no destination pointer, avoid related-handle re-entry and return without
 * unwinding. See the complete contract at
 * https://github.com/emuella/emuella-j2k/blob/main/docs/c-abi-safety-contract.md.
 */
"""
documentation = true
usize_is_size_t = true
style = "both"
sort_by = "Name"
cpp_compat = true

[parse]
parse_deps = false

[export]
prefix = ""
