[package]
name = "emuella-j2k-test-support"
description = "Deterministic project-authored tests and fixture generation for emuella-j2k."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true

[features]
parallel = ["emuella-j2k-core/parallel"]
simd = ["emuella-j2k-core/simd"]

[dependencies]
emuella-j2k-codestream = { workspace = true, features = ["test-fixtures"] }
emuella-j2k-core = { workspace = true, features = ["std"] }
emuella-j2k-tier1 = { workspace = true, features = ["std"] }

[dev-dependencies]
sha2 = "0.11.0"
serde_json = "1.0.145"
rayon = "1.11.0"

[lints]
workspace = true
