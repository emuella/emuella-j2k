name: emuella-j2k CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: python3 scripts/test-public-tree-policy.py
      - run: python3 scripts/test-package-legal-policy.py
      - run: python3 scripts/test-layer2-conformance-inspection.py
      - run: python3 scripts/test-layer2-decoded-pixel-canary.py
      - run: python3 scripts/test-layer2-derived-set.py
      - run: python3 scripts/audit-public-tree.py
      - run: python3 scripts/generate-binary-dependency-notices.py --check
      - name: Check dependency policy and licences
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""
      - name: Check fuzz dependency policy and licences
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./crates/emuella-j2k-codestream/fuzz/Cargo.toml
          command: check
          arguments: --locked --config crates/emuella-j2k-codestream/fuzz/deny.toml
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path crates/emuella-j2k-codestream/fuzz/Cargo.toml --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo check -p emuella-j2k-codestream --features parallel
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/emuella-j2k-codestream/fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo check -p emuella-j2k -p emuella-j2k-core -p emuella-j2k-codestream -p emuella-j2k-container -p emuella-j2k-ht -p emuella-j2k-tier1 -p emuella-j2k-transform --no-default-features
      - run: cargo check --manifest-path crates/emuella-j2k-codestream/fuzz/Cargo.toml --all-targets --locked
