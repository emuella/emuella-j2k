name: emuella-j2k CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: checkout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      # This audits the sibling export before cache restore.
      - name: Prepare and audit exact source
        id: prepare
        run: python3 checkout/scripts/check-committed-tree.py --ci-prepare
      - name: Check dependency policy and licences
        id: deny
        if: steps.prepare.outputs.route == 'full'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./ci-verification/source/Cargo.toml
          rust-version: 1.98.1
          command: check
          arguments: --config ci-verification/source/deny.toml
      - name: Check fuzz dependency policy and licences
        id: deny_fuzz
        if: steps.prepare.outputs.route == 'full'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./ci-verification/source/crates/emuella-j2k-codestream/fuzz/Cargo.toml
          rust-version: 1.98.1
          command: check
          arguments: --locked --config ci-verification/source/crates/emuella-j2k-codestream/fuzz/deny.toml
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v3-emuella-ci-source-export
          # Metadata survives export cleanup for the action's post-job save.
          key: ${{ hashFiles('checkout/Cargo.toml') }}
          workspaces: |
            checkout -> target
            checkout/crates/emuella-j2k-codestream/fuzz -> target
          cache-bin: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.prepare.outputs.route == 'full' }}
      - name: Run selected fixed verification group
        id: selected
        env:
          EMUELLA_BINDING_SHA256: ${{ steps.prepare.outputs.binding_sha256 }}
        run: python3 checkout/scripts/check-committed-tree.py --ci-run --binding-sha256 "$EMUELLA_BINDING_SHA256"
      - name: Check selected results, source integrity and cleanup
        if: always()
        env:
          EMUELLA_BINDING_SHA256: ${{ steps.prepare.outputs.binding_sha256 }}
          EMUELLA_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python3 checkout/scripts/check-committed-tree.py --ci-finish --binding-sha256 "$EMUELLA_BINDING_SHA256"
