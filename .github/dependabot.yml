version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The action's numeric tags can precede the corresponding Rust release.
      # Compiler updates must also reconcile Cargo.toml and project guidance.
      - dependency-name: dtolnay/rust-toolchain
